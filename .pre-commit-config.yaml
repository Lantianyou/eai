# Git hooks managed by prek — https://github.com/j178/prek
minimum_prek_version: "0.5.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt (via vite-plus)
        entry: pnpm exec vp fmt
        language: system
        types_or: [ts, vue, css, json, yaml, markdown]
      - id: oxlint
        name: oxlint (via vite-plus)
        entry: pnpm exec vp lint
        language: system
        types_or: [ts, vue]
